<body>
<h2>Student Portal</h2>
<input type="text" id="roomId" placeholder="Enter Room ID"/>
<button id="joinBtn">Join Session</button>

<div id="videoContainer">
  <video id="studentVideo" autoplay muted></video>
  <video id="counselorVideo" autoplay></video>
</div>

<div id="controls">
  <button id="toggleVideo">Toggle Video</button>
  <button id="toggleAudio">Toggle Audio</button>
  <button id="endBtn">End Session</button>
</div>

<h3>Live Transcript:</h3>
<div id="transcript"></div>
