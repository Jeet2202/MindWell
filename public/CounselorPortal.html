<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Counselor Portal</title>
<link rel="stylesheet" href="CounselorPortal.css">
</head>
<body>
<h2>Counselor Portal</h2>
<input type="text" id="roomId" placeholder="Enter Room ID"/>
<button id="joinBtn">Join Session</button>

<div id="videoContainer">
  <video id="counselorVideo" autoplay muted></video>
  <video id="studentVideo" autoplay></video>
</div>

<div id="controls">
  <button id="toggleVideo">Toggle Video</button>
  <button id="toggleAudio">Toggle Audio</button>
  <button id="generateReport">Generate AI Report</button>
</div>

<h3>Live Transcript:</h3>
<div id="transcript"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="CounselorPortal.js"></script>
</body>
</html>
